<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alight Motion Premium Generator</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 700px; margin: 2rem auto; padding: 0 1rem; }
    input, button { width: 100%; padding: 0.7rem; margin: 0.5rem 0; font-size: 1rem; }
    button { background: #0070f3; color: white; border: none; border-radius: 5px; cursor: pointer; }
    button:hover { background: #0051a2; }
    #loading { color: #0070f3; font-weight: bold; display: none; }
    pre { background: #f4f4f4; padding: 1rem; border-radius: 5px; overflow-x: auto; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>🎬 Alight Motion Premium Generator</h1>
  <p>Masukkan API Key dari <strong>fgsi.dpdns.org</strong> lalu klik Generate.</p>
  <input type="text" id="apiKey" placeholder="fgsiapi-xxxxxxxx-xx" />
  <button id="generateBtn">🚀 Generate</button>
  <div id="loading">⏳ Sedang memproses, mohon tunggu (bisa memakan waktu hingga 60 detik)...</div>
  <div id="result">
    <h3>📋 Hasil</h3>
    <pre id="output">Belum ada data</pre>
  </div>

  <script>
    document.getElementById('generateBtn').addEventListener('click', async () => {
      const apiKey = document.getElementById('apiKey').value.trim();
      if (!apiKey) {
        alert('Silakan masukkan API Key Anda.');
        return;
      }
      const loading = document.getElementById('loading');
      const output = document.getElementById('output');
      loading.style.display = 'block';
      output.textContent = 'Menunggu respons dari server...';

      try {
        const res = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ apiKey })
        });
        const data = await res.json();
        output.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        output.textContent = '❌ Error: ' + err.message;
      } finally {
        loading.style.display = 'none';
      }
    });
  </script>
</body>
</html>
