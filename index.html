<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alight Motion · Premium Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f4f6fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .card {
            max-width: 480px;
            width: 100%;
            background: #ffffff;
            border-radius: 2rem;
            padding: 2.5rem 2rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.06);
            border: 1px solid rgba(0,0,0,0.02);
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 0.25rem;
        }
        .logo-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(145deg, #2563eb, #7c3aed);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1.4rem;
            box-shadow: 0 8px 18px rgba(37, 99, 235, 0.25);
        }
        .logo h1 { font-size: 1.5rem; font-weight: 700; color: #0f172a; }
        .subhead { font-size: 0.85rem; color: #64748b; margin-bottom: 2rem; padding-left: 0.75rem; border-left: 3px solid #e2e8f0; }

        .form-group { margin-bottom: 1.25rem; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; color: #1e293b; margin-bottom: 0.4rem; }
        .form-group input {
            width: 100%;
            padding: 0.85rem 1rem;
            border: 1.5px solid #e2e8f0;
            border-radius: 1rem;
            font-size: 0.95rem;
            background: #f8fafc;
            transition: 0.2s;
            outline: none;
            font-family: inherit;
        }
        .form-group input:focus { border-color: #2563eb; background: #fff; box-shadow: 0 0 0 4px rgba(37,99,235,0.08); }

        .btn {
            width: 100%;
            padding: 0.9rem;
            border: none;
            border-radius: 1rem;
            font-size: 1rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .btn-primary { background: #0f172a; color: #fff; box-shadow: 0 4px 12px rgba(15,23,42,0.15); }
        .btn-primary:hover { background: #1e293b; }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

        .btn-success { background: #059669; color: #fff; box-shadow: 0 4px 12px rgba(5,150,105,0.2); }
        .btn-success:hover { background: #047857; }
        .btn-success:disabled { opacity: 0.6; cursor: not-allowed; }

        .divider { height: 1px; background: #e9edf2; margin: 1.5rem 0; }

        .result-box {
            background: #f8fafc;
            border-radius: 1rem;
            padding: 1rem 1.25rem;
            border: 1.5px solid #e2e8f0;
            margin-top: 1.5rem;
            min-height: 70px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .result-box .status-badge {
            display: inline-block;
            padding: 0.2rem 0.8rem;
            border-radius: 100px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            width: fit-content;
        }
        .badge-success { background: #dcfce7; color: #166534; }
        .badge-error { background: #fee2e2; color: #991b1b; }
        .badge-pending { background: #fef9c3; color: #854d0e; }
        .badge-info { background: #dbeafe; color: #1e40af; }

        .result-box .msg { font-size: 0.95rem; color: #0f172a; }
        .result-box .sub-msg { font-size: 0.8rem; color: #64748b; margin-top: 0.25rem; }

        .hidden { display: none !important; }

        .footer { margin-top: 2rem; font-size: 0.7rem; color: #94a3b8; text-align: center; }
        .footer i { margin-right: 4px; }
    </style>
</head>
<body>

<div class="card">
    <div class="logo">
        <div class="logo-icon"><i class="fas fa-bolt"></i></div>
        <h1>Alight Motion · Pro</h1>
    </div>
    <div class="subhead">Akses premium untuk pembelajaran & testing</div>

    <!-- STEP 1: Kirim Email -->
    <div id="stepSend">
        <div class="form-group">
            <label for="emailInput"><i class="far fa-envelope" style="margin-right:6px;"></i>Email Tujuan</label>
            <input type="email" id="emailInput" placeholder="contoh: user@mail.com" value="29o1fsuh6u@ruutukf.com" />
        </div>
        <button class="btn btn-primary" id="btnSend">
            <i class="fas fa-paper-plane"></i> <span>Kirim Magic Link</span>
        </button>
    </div>

    <!-- STEP 2: Verifikasi Link (muncul setelah sukses kirim) -->
    <div id="stepVerify" class="hidden" style="margin-top:1.5rem;">
        <div class="form-group">
            <label for="linkInput"><i class="fas fa-link" style="margin-right:6px;"></i>Tempel Link Verifikasi</label>
            <input type="text" id="linkInput" placeholder="https://alight-creative.firebaseapp.com/__/auth/links?link=..." />
        </div>
        <button class="btn btn-success" id="btnVerify">
            <i class="fas fa-check-circle"></i> <span>Verifikasi & Aktivasi</span>
        </button>
        <p style="font-size:0.75rem; color:#94a3b8; margin-top:0.5rem; text-align:center;">
            <i class="fas fa-info-circle"></i> Cek email (termasuk spam) lalu salin seluruh URL-nya.
        </p>
    </div>

    <!-- Result / Status -->
    <div class="result-box" id="resultBox">
        <div id="resultContent">
            <span class="status-badge badge-info" id="badgeStatus">⏳ Menunggu</span>
            <div class="msg" id="mainMessage">Masukkan email dan kirim magic link.</div>
            <div class="sub-msg" id="subMessage">API tidak terekspos, semua proses melalui server proxy.</div>
        </div>
    </div>

    <div class="footer">
        <i class="fas fa-shield-alt"></i> Untuk pembelajaran · Backend Proxy Serverless
    </div>
</div>

<script>
    (function() {
        const emailInput = document.getElementById('emailInput');
        const linkInput = document.getElementById('linkInput');
        const btnSend = document.getElementById('btnSend');
        const btnVerify = document.getElementById('btnVerify');
        const stepVerify = document.getElementById('stepVerify');
        const badgeStatus = document.getElementById('badgeStatus');
        const mainMsg = document.getElementById('mainMessage');
        const subMsg = document.getElementById('subMessage');

        let currentEmail = '';

        function setStatus(type, main, sub) {
            badgeStatus.className = 'status-badge';
            if (type === 'success') badgeStatus.classList.add('badge-success');
            else if (type === 'error') badgeStatus.classList.add('badge-error');
            else if (type === 'pending') badgeStatus.classList.add('badge-pending');
            else badgeStatus.classList.add('badge-info');

            badgeStatus.textContent = type.toUpperCase();
            mainMsg.textContent = main;
            subMsg.textContent = sub || '';
        }

        async function callApi(action, email, link = null) {
            const payload = { email, action };
            if (link) payload.link = link;

            const res = await fetch('/api/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            return data;
        }

        // Tombol Kirim
        btnSend.addEventListener('click', async function() {
            const email = emailInput.value.trim();
            if (!email) {
                setStatus('error', '❌ Email tidak boleh kosong', 'Masukkan alamat email yang valid.');
                return;
            }
            currentEmail = email;

            btnSend.disabled = true;
            btnSend.querySelector('span').textContent = 'Mengirim...';
            setStatus('pending', '⏳ Mengirim magic link...', 'Mohon tunggu, proses proxy sedang berjalan.');

            try {
                const data = await callApi('send', email);
                if (data.success) {
                    setStatus('success', '✅ ' + data.message, 'Silakan cek email Anda.');
                    stepVerify.classList.remove('hidden');
                    linkInput.value = '';
                } else {
                    let errMsg = data.message || 'Gagal mengirim.';
                    if (data.retry_after) errMsg += ` (Coba lagi ${data.retry_after} detik)`;
                    setStatus('error', '❌ ' + errMsg, 'Periksa kembali email atau tunggu rate limit.');
                }
            } catch (err) {
                setStatus('error', '❌ Gagal terhubung ke server proxy.', 'Cek koneksi internet Anda.');
            } finally {
                btnSend.disabled = false;
                btnSend.querySelector('span').textContent = 'Kirim Magic Link';
            }
        });

        // Tombol Verifikasi
        btnVerify.addEventListener('click', async function() {
            const link = linkInput.value.trim();
            if (!link) {
                setStatus('error', '❌ Link verifikasi wajib diisi', 'Salin URL dari email dan tempel di sini.');
                return;
            }
            if (!currentEmail) {
                setStatus('error', '❌ Email tidak ditemukan', 'Klik "Kirim Magic Link" terlebih dahulu.');
                return;
            }

            btnVerify.disabled = true;
            btnVerify.querySelector('span').textContent = 'Memverifikasi...';
            setStatus('pending', '⏳ Memverifikasi link...', 'Menukarkan kode dengan Firebase...');

            try {
                const data = await callApi('verify', currentEmail, link);
                if (data.success) {
                    setStatus('success', '🎉 ' + data.message, 'Selamat! Akses premium aktif untuk pembelajaran.');
                    stepVerify.classList.add('hidden');
                } else {
                    let errMsg = data.message || 'Gagal verifikasi.';
                    if (data.retry_after) errMsg += ` (Coba lagi ${data.retry_after} detik)`;
                    setStatus('error', '❌ ' + errMsg, 'Pastikan link yang dimasukkan benar dan belum expired.');
                }
            } catch (err) {
                setStatus('error', '❌ Gagal terhubung ke server proxy.', 'Cek koneksi internet Anda.');
            } finally {
                btnVerify.disabled = false;
                btnVerify.querySelector('span').textContent = 'Verifikasi & Aktivasi';
            }
        });

        // Inisialisasi
        setStatus('info', 'Masukkan email dan kirim magic link.', 'API tidak terekspos, semua proses melalui server proxy.');
    })();
</script>
</body>
</html>
